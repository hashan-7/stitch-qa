[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "stitch-cli"
version = "0.2.0"
description = "CLI tool for Stitch QA"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "rich>=13.7,<15",
    "requests>=2.32,<3",
    "urllib3>=2.2,<3",
    "pytest>=8,<10"
]

[project.scripts]
stitch = "stitch_cli.main:cli"
