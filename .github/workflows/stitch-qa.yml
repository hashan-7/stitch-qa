name: Stitch QA Scan

on:
  workflow_dispatch:

jobs:
  qa-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix mvnw permissions
        run: |
          chmod +x demo/mvnw 2>/dev/null || true
          find . -name "mvnw" -exec chmod +x {} \; 2>/dev/null || true

      - name: Create Java Maven demo for supported test
        run: |
          mkdir -p demo/src/main/java/com/stitchqa/demo demo/src/test/java/com/stitchqa/demo
          printf '%s\n' \
            '<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">' \
            '  <modelVersion>4.0.0</modelVersion>' \
            '  <groupId>com.stitchqa</groupId>' \
            '  <artifactId>ci-demo</artifactId>' \
            '  <version>1.0.0</version>' \
            '  <properties><maven.compiler.release>17</maven.compiler.release><project.build.sourceEncoding>UTF-8</project.build.sourceEncoding></properties>' \
            '  <dependencies><dependency><groupId>org.junit.jupiter</groupId><artifactId>junit-jupiter</artifactId><version>5.10.2</version><scope>test</scope></dependency></dependencies>' \
            '  <build><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-surefire-plugin</artifactId><version>3.2.5</version></plugin></plugins></build>' \
            '</project>' > demo/pom.xml
          printf '%s\n' \
            'package com.stitchqa.demo;' \
            '' \
            'public final class App {' \
            '    private App() {}' \
            '    public static int add(int left, int right) { return left + right; }' \
            '}' > demo/src/main/java/com/stitchqa/demo/App.java
          printf '%s\n' \
            'package com.stitchqa.demo;' \
            '' \
            'import static org.junit.jupiter.api.Assertions.assertEquals;' \
            'import org.junit.jupiter.api.Test;' \
            '' \
            'class AppTest {' \
            '    @Test void addsNumbers() { assertEquals(4, App.add(2, 2)); }' \
            '}' > demo/src/test/java/com/stitchqa/demo/AppTest.java

      - name: Create PHP demo for unsupported test
        run: |
          mkdir -p demo-php
          echo "<?php echo 'Hello World'; ?>" > demo-php/index.php

      - name: Run Stitch QA on Java Maven demo
        uses: ./
        with:
          project-path: './demo'

      - name: Run Stitch QA on PHP demo (unsupported)
        uses: ./
        with:
          project-path: './demo-php'

      - name: Upload QA reports
        uses: actions/upload-artifact@v4
        with:
          name: stitch-qa-reports
          path: |
            demo/STITCH_QA_REPORT.md
            demo/STITCH_QA_REPORT.json
            demo-php/STITCH_QA_REPORT.md
            demo-php/STITCH_QA_REPORT.json
