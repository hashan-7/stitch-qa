name: Deploy HF Agents

on:
  push:
    branches:
      - dev
    paths:
      - "agents/log-agent/**"
      - "agents/repair-agent/**"
      - "agents/code-agent/**"
      - ".github/workflows/deploy-hf-agents.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-log-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7.0.0

      - name: Install Hugging Face CLI
        run: python -m pip install "huggingface_hub==1.27.0"

      - name: Prepare Runtime Quality Intelligence Analyst files
        run: |
          mkdir -p hf-log-agent
          cp agents/log-agent/*.py hf-log-agent/
          cp agents/log-agent/requirements.txt hf-log-agent/
          cp agents/log-agent/Dockerfile hf-log-agent/
          cp agents/log-agent/README.md hf-log-agent/

      - name: Deploy Runtime Quality Intelligence Analyst
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload hashan-77/stitch-qa-log-agent hf-log-agent . --repo-type=space --delete="*" --commit-message="Deploy Runtime Quality Intelligence Analyst v2.0"

  deploy-repair-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7.0.0

      - name: Install Hugging Face CLI
        run: python -m pip install "huggingface_hub==1.27.0"

      - name: Prepare repair agent files
        run: |
          mkdir -p hf-repair-agent
          cp agents/repair-agent/app.py hf-repair-agent/
          cp agents/repair-agent/requirements.txt hf-repair-agent/
          cp agents/repair-agent/Dockerfile hf-repair-agent/
          cp agents/repair-agent/README.md hf-repair-agent/

      - name: Deploy repair agent to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload hashan-77/stitch-qa-repair-agent hf-repair-agent . --repo-type=space --delete="*" --commit-message="Deploy repair agent from GitHub Actions"

  deploy-code-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7.0.0

      - name: Install Hugging Face CLI
        run: python -m pip install "huggingface_hub==1.27.0"

      - name: Prepare code agent files
        run: |
          mkdir -p hf-code-agent
          cp agents/code-agent/app.py hf-code-agent/
          cp agents/code-agent/requirements.txt hf-code-agent/
          cp agents/code-agent/Dockerfile hf-code-agent/
          cp agents/code-agent/README.md hf-code-agent/

      - name: Deploy code agent to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload hashan-77/stitch-qa-code-agent hf-code-agent . --repo-type=space --delete="*" --commit-message="Deploy code agent from GitHub Actions"
