name: Deploy HF Agents

on:
  push:
    branches:
      - dev
    paths:
      - "agents/log-agent/**"
      - "agents/repair-agent/**"
      - "agents/code-agent/**"
      - ".github/workflows/deploy-hf-agents.yml"
  workflow_dispatch:

jobs:
  deploy-log-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Prepare log agent files
        run: |
          mkdir -p hf-log-agent
          cp agents/log-agent/app.py hf-log-agent/
          cp agents/log-agent/requirements.txt hf-log-agent/
          cp agents/log-agent/Dockerfile hf-log-agent/
          cp agents/log-agent/README.md hf-log-agent/

      - name: Deploy log agent to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload hashan-7/stitch-qa-log-agent hf-log-agent . --repo-type=space --delete="*" --commit-message="Deploy log agent from GitHub Actions"

  deploy-repair-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Prepare repair agent files
        run: |
          mkdir -p hf-repair-agent
          cp agents/repair-agent/app.py hf-repair-agent/
          cp agents/repair-agent/requirements.txt hf-repair-agent/
          cp agents/repair-agent/Dockerfile hf-repair-agent/
          cp agents/repair-agent/README.md hf-repair-agent/

      - name: Deploy repair agent to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload hashan-7/stitch-qa-repair-agent hf-repair-agent . --repo-type=space --delete="*" --commit-message="Deploy repair agent from GitHub Actions"

  deploy-code-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Prepare code agent files
        run: |
          mkdir -p hf-code-agent
          cp agents/code-agent/app.py hf-code-agent/
          cp agents/code-agent/requirements.txt hf-code-agent/
          cp agents/code-agent/Dockerfile hf-code-agent/
          cp agents/code-agent/README.md hf-code-agent/

      - name: Deploy code agent to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload hashan-7/stitch-qa-code-agent hf-code-agent . --repo-type=space --delete="*" --commit-message="Deploy code agent from GitHub Actions"